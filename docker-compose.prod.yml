version: "3.9"

# ─── Production Docker Compose ─────────────────────────────────────────────────
# Differences from dev docker-compose.yml:
#   • 3 Gunicorn backend replicas (round-robin via Nginx upstream)
#   • Separate Daphne container for WebSocket traffic
#   • Redis Sentinel for HA cache/broker
#   • DJANGO_SETTINGS_MODULE → production
#   • No bind-mounts of source code
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: fugusau_db_prod
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

  # ─── Redis Master ────────────────────────────────────────────────────────────
  redis-master:
    image: redis:7-alpine
    container_name: fugusau_redis_master
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_master_data:/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis Replica ───────────────────────────────────────────────────────────
  redis-replica:
    image: redis:7-alpine
    container_name: fugusau_redis_replica
    restart: always
    command: redis-server --replicaof redis-master 6379 --loglevel warning
    volumes:
      - redis_replica_data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - backend_net

  # ─── Redis Sentinel ──────────────────────────────────────────────────────────
  redis-sentinel:
    image: redis:7-alpine
    container_name: fugusau_redis_sentinel
    restart: always
    command: >
      sh -c "echo 'sentinel monitor mymaster redis-master 6379 1' > /tmp/sentinel.conf && echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf && echo 'sentinel failover-timeout mymaster 10000' >> /tmp/sentinel.conf && echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
    depends_on:
      - redis-master
      - redis-replica
    networks:
      - backend_net

  # ─── Gunicorn Backend (3 replicas) ──────────────────────────────────────────
  # Nginx distributes across all 3 with round-robin load balancing
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    restart: always
    env_file: ./backend/.env.production
    environment:
      DJANGO_SETTINGS_MODULE: fugusau.settings.production
      DB_HOST: db
      REDIS_URL: redis://redis-master:6379/0
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn --config gunicorn.conf.py fugusau.wsgi:application"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    networks:
      - backend_net
      - frontend_net

  # ─── Daphne — WebSocket / ASGI server ───────────────────────────────────────
  daphne:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: fugusau_daphne_prod
    restart: always
    env_file: ./backend/.env.production
    environment:
      DJANGO_SETTINGS_MODULE: fugusau.settings.production
      DB_HOST: db
      REDIS_URL: redis://redis-master:6379/0
    command: daphne -b 0.0.0.0 -p 8001 --proxy-headers fugusau.asgi:application
    ports:
      - "8000:8001"
    volumes:
      - media_files:/app/media
    depends_on:
      - backend
      - redis-master
    networks:
      - backend_net
      - frontend_net

  # ─── Celery Worker ───────────────────────────────────────────────────────────
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: fugusau_celery_prod
    restart: always
    env_file: ./backend/.env.production
    environment:
      DJANGO_SETTINGS_MODULE: fugusau.settings.production
      DB_HOST: db
      REDIS_URL: redis://redis-master:6379/0
    command: celery -A fugusau worker --loglevel=info --concurrency=4
    volumes:
      - media_files:/app/media
    depends_on:
      - backend
      - redis-master
    networks:
      - backend_net

  # ─── Celery Beat ─────────────────────────────────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: fugusau_celerybeat_prod
    restart: always
    env_file: ./backend/.env.production
    environment:
      DJANGO_SETTINGS_MODULE: fugusau.settings.production
      DB_HOST: db
      REDIS_URL: redis://redis-master:6379/0
    command: >
      celery -A fugusau beat --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      - celery
    networks:
      - backend_net

  # ─── React Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    container_name: fugusau_frontend_prod
    restart: always
    environment:
      VITE_API_URL: http://10.14.130.26/api/v1
      VITE_WS_URL: ws://10.14.130.26/ws
    networks:
      - frontend_net

  # ─── Nginx (HTTP + HTTPS + WebSocket routing) ────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: fugusau_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/var/www/static:ro
      - media_files:/var/www/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - daphne
      - frontend
    networks:
      - frontend_net
      - backend_net

networks:
  backend_net:
    driver: bridge
  frontend_net:
    driver: bridge

volumes:
  postgres_data:
  redis_master_data:
  redis_replica_data:
  static_files:
  media_files:
