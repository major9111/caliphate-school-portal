version: '3.9'

services:
  # ─── PostgreSQL Database ───────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: fugusau_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-fugusau_db}
      POSTGRES_USER: ${DB_USER:-fugusau_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fugusau_pass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fugusau_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis Cache + Channel Layer ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fugusau_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Django Backend ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fugusau_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - media_files:/app/media
      - static_files:/app/staticfiles
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=fugusau.settings.development
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 fugusau.asgi:application"

  # ─── Celery Worker ────────────────────────────────────────────
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fugusau_celery
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - media_files:/app/media
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=fugusau.settings.development
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - backend
      - redis
    command: celery -A fugusau worker -l info --concurrency=4

  # ─── Celery Beat (Scheduler) ──────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fugusau_celery_beat
    restart: unless-stopped
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=fugusau.settings.development
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - celery
    command: celery -A fugusau beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # ─── React Frontend ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fugusau_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      - VITE_WS_URL=ws://localhost:8000/ws
    depends_on:
      - backend

  # ─── Nginx Reverse Proxy ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: fugusau_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/var/www/static:ro
      - media_files:/var/www/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  media_files:
  static_files:
