    <meta name="description" content="Federal University Gusau (FUGUSAU) — official university website. Admissions, academics, research, student life, news and events at FUGUSAU, Zamfara State, Nigeria." />
    <meta name="keywords" content="Federal University Gusau, FUGUSAU, FUGUSAU admission, FUGUSAU portal, Zamfara university, POST-UTME Gusau" />

    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('fugusau-site-theme');
          var theme = (stored === 'light' || stored === 'dark') ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <!-- JSON-LD structured data for search engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollegeOrUniversity",
      "name": "Federal University Gusau",
      "alternateName": "FUGUSAU",
      "url": "https://www.fugusau.edu.ng",
      "logo": "https://www.fugusau.edu.ng/fugusau-logo.png",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Gusau",
        "addressRegion": "Zamfara State",
        "addressCountry": "NG"
      }
    }
    </script>
  </head>
